name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check repository hygiene
        run: python tools/check.py
      - name: Check extraction evidence handling
        run: python -m unittest discover -s tools/extraction -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install the calculation dependencies
        run: |
          npm ci --ignore-scripts
          touch node_modules/.gdignore
      - name: Check calculation regressions
        run: npm test
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Check the embedded browser calculation
        run: node tools/verify_kernel_browser.mjs
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
      - name: Install Godot 4.7.2
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import the project
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --import --path . > /tmp/first-import.log 2>&1
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --import --path . 2>&1 | tee /tmp/import.log
          ! grep -E 'SCRIPT ERROR:|ERROR:' /tmp/import.log
      - name: Check dataset and plan validation
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tools/test_data.gd 2>&1 | tee /tmp/data-check.log
          ! grep -E 'SCRIPT ERROR:|ERROR:' /tmp/data-check.log
      - name: Check keyboard focus and interface audio
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tools/test_ui.gd 2>&1 | tee /tmp/ui-check.log
          ! grep -E 'SCRIPT ERROR:|ERROR:' /tmp/ui-check.log
      - name: Check goal editing and undo
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tools/test_goal_editor.gd 2>&1 | tee /tmp/goal-check.log
          ! grep -E 'SCRIPT ERROR:|ERROR:' /tmp/goal-check.log
      - name: Check calculation file cleanup
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tools/test_computation.gd 2>&1 | tee /tmp/computation-check.log
          ! grep -E 'SCRIPT ERROR:|ERROR:' /tmp/computation-check.log
      - name: Check factory settings and undo
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tools/test_factory_settings.gd 2>&1 | tee /tmp/settings-check.log
          ! grep -E 'SCRIPT ERROR:|ERROR:' /tmp/settings-check.log
