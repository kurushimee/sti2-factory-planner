include_filter="data/example.json,data/statech-2.0.1.json.gz,data/ATTRIBUTION.md,data/licenses/*.txt,data/provenance/sources.json,data/provenance/distribution-*.json,data/provenance/statech-2.0.1-inputs.json,ui/fonts/OFL.txt"
